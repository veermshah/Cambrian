# Local Postgres and Redis for development. The swarm itself runs with
# `go run ./cmd/swarm` (or the Docker image) against these services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cambrian
      POSTGRES_PASSWORD: cambrian
      POSTGRES_DB: cambrian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambrian"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
